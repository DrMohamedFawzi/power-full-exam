worker_processes auto;
worker_rlimit_nofile 100000;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections  10240;
    use                 epoll;
    multi_accept        on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct=$upstream_connect_time '
                    'uht=$upstream_header_time urt=$upstream_response_time';

    access_log /var/log/nginx/access.log main buffer=64k flush=5s;

    # ── Performance ──────────────────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;

    # ── Compression ──────────────────────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        text/xml;

    # ── Rate limiting (protect against abuse, not exam traffic) ──────────
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=200r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;

    # ── Upstream — Octane app instances (Round-Robin) ─────────────────────
    upstream aegis_app {
        least_conn;                    # route to least busy worker

        server app:8000 weight=1 max_fails=3 fail_timeout=30s;
        # In K8s / ECS this resolves to multiple pod IPs:
        # server app:8000;  ← resolved by service DNS to N pods

        keepalive 512;                 # persistent connections to Octane
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    # ── Main HTTPS server ─────────────────────────────────────────────────
    server {
        listen 443 ssl http2;
        server_name _;

        root /var/www/html/public;

        # ── TLS ────────────────────────────────────────────────────────────
        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers on;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 10m;

        # ── Security headers ───────────────────────────────────────────────
        add_header X-Frame-Options         "SAMEORIGIN"  always;
        add_header X-Content-Type-Options  "nosniff"     always;
        add_header X-XSS-Protection        "1; mode=block" always;
        add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

        # ── Static assets (served by Nginx directly — no PHP hit) ──────────
        location ~* \.(css|js|woff2?|png|jpg|jpeg|gif|svg|ico|webp)$ {
            expires     1y;
            add_header  Cache-Control "public, immutable";
            try_files   $uri =404;
        }

        # ── Auth endpoint (rate limited) ───────────────────────────────────
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            try_files $uri $uri/ @octane;
        }

        # ── API endpoints (generous limit for exam traffic) ────────────────
        location /api/ {
            limit_req zone=api_limit burst=500 nodelay;
            try_files $uri $uri/ @octane;
        }

        # ── All other routes → Octane ──────────────────────────────────────
        location / {
            try_files $uri $uri/ @octane;
        }

        # ── Octane proxy block ─────────────────────────────────────────────
        location @octane {
            proxy_pass         http://aegis_app;
            proxy_http_version 1.1;

            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";     # enable keepalive to upstream

            proxy_read_timeout    30s;
            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;

            proxy_buffer_size          16k;
            proxy_buffers              8 16k;
            proxy_busy_buffers_size    32k;
        }

        # ── Health check (no logging) ──────────────────────────────────────
        location /up {
            access_log off;
            proxy_pass http://aegis_app;
        }
    }
}
