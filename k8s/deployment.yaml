# ═══════════════════════════════════════════════════════════════════
#  Aegis-X — Kubernetes Deployment
#  App: Laravel Octane / Swoole
#  Min replicas: 3  |  Max replicas: 50  |  Scale at: CPU 70%
# ═══════════════════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-app
  namespace: aegis
  labels:
    app: aegis-app
    component: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: aegis-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 2
      maxUnavailable: 0          # Zero-downtime deploys
  template:
    metadata:
      labels:
        app: aegis-app
        component: web
    spec:
      # Spread pods across nodes for HA
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: aegis-app

      containers:
        - name: app
          image: registry.example.com/aegis-x:latest
          imagePullPolicy: Always

          ports:
            - containerPort: 8000
              name: http

          command:
            - php
            - artisan
            - octane:start
            - --server=swoole
            - --host=0.0.0.0
            - --port=8000
            - --workers=auto
            - --max-requests=500

          env:
            - name: APP_ENV
              value: production
            - name: OCTANE_SERVER
              value: swoole

          envFrom:
            - secretRef:
                name: aegis-secrets

          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "1Gi"

          livenessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /up
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 2

          lifecycle:
            preStop:
              exec:
                # Graceful shutdown: wait for in-flight requests to complete
                command: ["php", "artisan", "octane:stop"]

      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: aegis-app-svc
  namespace: aegis
spec:
  selector:
    app: aegis-app
  ports:
    - name: http
      port: 80
      targetPort: 8000
  type: ClusterIP

---
# ── Horizon Workers Deployment ──────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-horizon
  namespace: aegis
  labels:
    app: aegis-horizon
    component: queue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aegis-horizon
  template:
    metadata:
      labels:
        app: aegis-horizon
        component: queue
    spec:
      containers:
        - name: horizon
          image: registry.example.com/aegis-x:latest
          imagePullPolicy: Always
          command: ["php", "artisan", "horizon"]

          envFrom:
            - secretRef:
                name: aegis-secrets

          resources:
            requests:
              cpu: "1000m"
              memory: "1Gi"
            limits:
              cpu: "4000m"
              memory: "2Gi"

          livenessProbe:
            exec:
              command: ["php", "artisan", "horizon:status"]
            initialDelaySeconds: 30
            periodSeconds: 60

      terminationGracePeriodSeconds: 60

---
# ── Scheduler Deployment ────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-scheduler
  namespace: aegis
spec:
  replicas: 1             # Only ONE scheduler pod to avoid duplicate runs
  selector:
    matchLabels:
      app: aegis-scheduler
  template:
    metadata:
      labels:
        app: aegis-scheduler
    spec:
      containers:
        - name: scheduler
          image: registry.example.com/aegis-x:latest
          command:
            - /bin/sh
            - -c
            - "while true; do php artisan schedule:run --verbose --no-interaction; sleep 60; done"
          envFrom:
            - secretRef:
                name: aegis-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
