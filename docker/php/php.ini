; ══════════════════════════════════════════════════════════
;  PHP runtime settings — Aegis-X / Octane / Swoole
; ══════════════════════════════════════════════════════════

; Memory — Octane keeps the app in RAM, so we give it room
memory_limit = 512M

; Execution time — Octane workers are long-lived, but individual
; requests should still have a wall-clock limit
max_execution_time = 30

; Upload limits
upload_max_filesize = 16M
post_max_size = 20M

; Error reporting (suppress in production — log instead)
display_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = Asia/Riyadh

; Realpath cache — boost file system calls
realpath_cache_size = 4096K
realpath_cache_ttl = 600
