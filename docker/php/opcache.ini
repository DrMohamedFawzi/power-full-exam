; ══════════════════════════════════════════════════════════
;  OPcache settings — maximized for production
;  With Octane/Swoole the app is loaded once and stays in RAM,
;  so OPcache should be aggressive.
; ══════════════════════════════════════════════════════════

[opcache]
opcache.enable = 1
opcache.enable_cli = 1

; How many scripts OPcache can store
opcache.max_accelerated_files = 20000

; Memory for cached bytecode (MB)
opcache.memory_consumption = 256

; String interning memory (MB)
opcache.interned_strings_buffer = 16

; Don't validate file timestamps in production (massive speedup)
opcache.validate_timestamps = 0

; Revalidation period (irrelevant when validate_timestamps=0)
opcache.revalidate_freq = 0

; Save bytecode to a file-based cache for faster warm-up after restart
opcache.file_cache = /tmp/opcache
opcache.file_cache_only = 0

; JIT — enabled for PHP 8.x, helps CPU-bound paths
opcache.jit = tracing
opcache.jit_buffer_size = 128M
